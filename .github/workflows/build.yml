name: Build Mandir App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Fixes permissions for cloud compilation
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Compiles the Kotlin source files into the APK file
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Uploads the finished APK so you can download it
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: MandirManager-APK
          path: app/build/outputs/apk/debug/*.apk
