name: Build Android APK

on:
  push:
    branches:
      - main # Runs automatically whenever you push code to the main branch
  workflow_dispatch: # Allows you to manually trigger the build with a button click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from your repository into the runner environment
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up the Java Environment (Required for Android Compiling)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Grants executive permissions to the Gradle build tool
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Compiles the source files into a debug APK
      - name: Compile and Build APK
        run: ./gradlew assembleDebug

      # 5. Extracts the compiled file out of the virtual machine so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandir-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
