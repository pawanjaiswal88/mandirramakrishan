name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Navigates into your folder and grants permission
      - name: Grant Execute Permission for Gradlew
        run: |
          cd YOUR_FOLDER_NAME
          chmod +x gradlew

      # Navigates into your folder and builds the APK
      - name: Compile and Build APK
        run: |
          cd YOUR_FOLDER_NAME
          ./gradlew assembleDebug

      # Extracts the built APK file from the correct path
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandir-app-debug-apk
          path: MandirManager/app/build/outputs/apk/debug/app-debug.apk
